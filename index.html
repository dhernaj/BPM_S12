<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semana 12 · Agile IT, Lean IT y DevOps</title>
<style>
:root{--g:#ffc000;--bg:#14161a;--c:#1f232a;--k:#f2f2f2;--m:#9aa3af;--ok:#3ecf8e;--no:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--k);font:15px/1.4 system-ui,sans-serif}
header{background:#000;border-bottom:3px solid var(--g);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{color:var(--g)}header span{color:var(--m);font-size:13px}
main{max-width:1100px;margin:auto;padding:12px}
.box{background:var(--c);border-radius:10px;padding:14px;margin:10px 0}
input,select,textarea{background:#0e1013;color:var(--k);border:1px solid #3a414c;border-radius:6px;padding:8px;font:inherit;max-width:100%}
textarea{width:100%}
button{background:var(--g);color:#000;border:0;border-radius:6px;padding:8px 13px;font-weight:700;cursor:pointer;margin:2px}
button.s{background:#323a46;color:var(--k)}button:disabled{opacity:.4}
#vw{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#vw img{width:100%;height:100%;object-fit:contain;display:block}
#hid{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:22px;text-align:center}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.it{padding:8px 0;border-bottom:1px solid #2c323c}.ok{color:var(--ok)}.no{color:var(--no)}
.pb{background:#0e1013;border-radius:4px;height:14px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g)}
table{border-collapse:collapse;width:100%}td,th{padding:5px 8px;border-bottom:1px solid #2c323c;text-align:left}
.cl span{display:inline-block;margin:3px 7px;color:var(--g);font-weight:700}
.msg{color:var(--no)}h3{margin:4px 0 8px;color:var(--g)}
</style></head><body>
<header><b>Semana 12 · Agile IT, Lean IT y DevOps</b><span id="who"></span><span id="st"></span></header>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const DBURL="PEGAR_AQUI_LA_DIRECCION_DE_FIREBASE";
const NS=26,LAST=26,SC=[4,7,10,17,18,21];
const PH='f10b5a880f2295a219d46dfccd490dba26d6e47ee5b23dc35cb1ffd54ce41aa0'; // SHA-256 de la clave docente
const EN=['Agile IT','Lean IT','DevOps'];
const ACT={
2:{t:'nube',h:'¿Qué hace que un trámite digital siga siendo lento? (hasta 3 palabras)'},
4:{t:'sel',p:15,sh:1,h:'¿Qué enfoque responde cada pregunta?',o:EN,i:[
 ['¿Qué incremento útil entregamos primero?',0],['¿Qué impide que fluya el trabajo?',1],['¿Cómo publicamos y operamos cambios confiables?',2]]},
5:{t:'vot',h:'Si el equipo termina más rápido pero la mejora no llega al usuario, ¿mejoró el servicio?',o:['Sí','No','Depende de lo que se mida']},
7:{t:'sel',p:15,sh:1,h:'Clasifique cada elemento',o:['Criterio de aceptación','Tarea técnica','Definición de terminado'],i:[
 ['El estudiante solo puede ver sus solicitudes',0],['Crear el servicio de consulta',1],['Pruebas superadas y permisos verificados en todo incremento',2],['Si no hay resultado, se muestra un mensaje sin datos ajenos',0]]},
8:{t:'vot',h:'¿Qué priorizarían primero por su valor?',o:['Consulta de estado','Validación de campos','Cambio de colores','Exportación avanzada']},
10:{t:'sel',p:20,sh:1,h:'Identifique el desperdicio',o:['Espera','Doble digitación','Acumulación','Correcciones','Sobreproducción'],i:[
 ['Copiar otra vez los mismos datos',1],['Datos incompletos que obligan a rehacer',3],['Solicitudes en cola sin atender',2],['Reportes que nadie usa',4]]},
13:{t:'txt',h:'Mejorar el trámite de una constancia (parejas)',f:['Cambiaremos…','Mantendremos… (control)','Mediremos… (indicador)']},
17:{t:'sel',p:20,sh:1,h:'¿Qué práctica describe cada caso?',o:['Integración continua','Entrega continua','Despliegue continuo'],i:[
 ['Se incorpora la consulta y se prueba con el resto del portal',0],['La consulta está lista, pero el responsable debe autorizar publicarla',1],['La consulta pasa las pruebas y llega al portal sin aprobación manual',2],['Cada integración ejecuta compilación y pruebas automáticas',0]]},
18:{t:'sel',p:15,h:'Ordene el flujo DevOps (1 a 4)',o:['1','2','3','4'],i:[
 ['Cambio versionado',0],['Pruebas automáticas',1],['Producción',2],['Monitoreo',3]]},
21:{t:'sel',p:15,sh:1,h:'Relacione problema e indicador',o:['Consultas por correo','% con corrección','Tiempo a producción','Falso'],i:[
 ['Estado no visible',0],['Doble digitación',1],['Cambio lento',2],['Verdadero o falso: consultar el estado garantiza una entrega más rápida',3,['Verdadero','Falso']]]},
24:{t:'txt',h:'Pregunta de salida',f:['¿Qué cambiaría primero tu equipo?','¿Qué evidencia demostraría la mejora?']}
};
// Tema (diapositiva donde se explica) por ítem; un solo elemento aplica a todos
const T={4:[['Qué pregunta resuelve cada enfoque',4]],
7:[['Criterios, tareas y definición de terminado',7]],
10:[['Desperdicios en servicios de TI',10]],
17:[['CI, entrega y despliegue continuos',17]],
18:[['Flujo DevOps paso a paso',18]],
21:[['Propuesta integrada para el caso',21]]};

const $=s=>document.querySelector(s),app=$('#app');
let db,sala,me=null,doc=false,S={},R={},N={},li=null,rd=null;
const nm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/["'«»“”]/g,'').replace(/\s+/g,' ').trim();
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const shuf=(a,seed)=>{let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))|0;return a.map((v,i)=>[v,i,Math.imul(h^(i*40503+1),2654435761)>>>0]).sort((x,y)=>x[2]-y[2]).map(x=>x[0])};
const ref=p=>db.ref('salas/'+sala+'/'+p);
const cur=()=>(!doc&&S.libre&&li!=null)?li:(S.i||0)+1;
const isSC=n=>SC.includes(n);
const sig=n=>ACT[n].t=='pred'?ACT[n].i.map(x=>x[1]):0;

function login(){
 app.innerHTML=`<div class="box"><h3>Ingreso</h3><p>Código de sala<br><input id="sa" placeholder="p. ej. BPM12-A"></p>
 <p><input id="co" placeholder="Código de estudiante"> <input id="no" placeholder="Nombre y apellido"> <input id="gr" placeholder="Grupo" size="8"></p>
 <button id="be">Entrar como estudiante</button> <button class="s" id="bd">Soy docente</button><p class="msg" id="er"></p></div>`;
 $('#be').onclick=()=>{const v=k=>$('#'+k).value.trim();if(!v('sa')||!v('co')||!v('no')||!v('gr'))return $('#er').textContent='Complete todos los campos.';
  sala=v('sa').replace(/[.#$\[\]\/]/g,'-');me={c:v('co').replace(/[.#$\[\]\/]/g,'-'),n:v('no'),g:v('gr')};start()};
 $('#bd').onclick=async()=>{const sa=$('#sa').value.trim();if(!sa)return $('#er').textContent='Escriba el código de sala.';
  const k=prompt('Clave docente');if(!k||await sha(k)!==PH)return $('#er').textContent='Clave incorrecta.';
  sala=sa.replace(/[.#$\[\]\/]/g,'-');doc=true;start()};
}
function initDB(){
 if(typeof firebase=='undefined'){app.innerHTML='<div class="box msg">No se cargó Firebase. Revise su internet y que abra la página desde GitHub Pages (https), no desde un archivo local ni desde una vista previa.</div>';return false}
 if(!/^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)/.test(DBURL)){app.innerHTML='<div class="box msg">Falta la dirección de Firebase: edite index.html y reemplace PEGAR_AQUI_LA_DIRECCION_DE_FIREBASE en la constante DBURL por la dirección de su Realtime Database.</div>';return false}
 try{firebase.initializeApp({databaseURL:DBURL});db=firebase.database();return true}catch(e){app.innerHTML='<div class="box msg">Dirección de Firebase no válida: '+E(e.message)+'</div>';return false}}
function start(){
 if(!initDB())return;
 $('#who').textContent='Sala '+sala+' · '+(doc?'Docente':me.n+' ('+me.g+')');
 const t=setTimeout(()=>{$('#st').textContent='Sin conexión con la base de datos: revise la dirección y las reglas.'},8000);
 ref('estado').on('value',s=>{clearTimeout(t);$('#st').textContent='';S=s.val()||{};S.act=S.act||{};S.rev=S.rev||{};S.mostrar=S.mostrar||{};draw()},e=>{$('#st').textContent='Firebase rechazó el acceso: publique las reglas.'});
 ref('resp').on('value',s=>{R=s.val()||{};panel(true)});
 ref('nube').on('value',s=>{N=s.val()||{};panel(true)});
 app.innerHTML=`<div id="vw"><img id="im"><div id="hid" hidden></div></div><div id="ctl" class="bar"></div><div id="pan"></div>`;
}
function draw(){
 if(!$('#vw'))return;const n=cur();
 $('#im').src='slides/s'+n+'.webp';
 const a=ACT[n],hide=isSC(n)&&S.act[n]&&!S.mostrar[n];$('#hid').hidden=!hide;
 $('#hid').innerHTML=hide?'Actividad en curso<br><small>Responda en el panel inferior</small>':'';
 let h='';
 if(doc){h+=`<button class="s" onclick="go(-1)">◀</button><b>${n} / ${NS}</b><button class="s" onclick="go(1)">▶</button>
  <label><input type="checkbox" ${S.libre?'checked':''} onchange="ref('estado/libre').set(this.checked)"> Modo libre</label>`;
  if(a){h+=`<button onclick="tog('act',${n})">${S.act[n]?'Cerrar':'Abrir'} actividad</button>`;
   if(a.t!='nube'&&a.t!='txt')h+=`<button class="s" onclick="tog('rev',${n})">${S.rev[n]?'Ocultar':'Revelar'} solución</button>`;
   if(isSC(n)&&S.act[n])h+=`<button class="s" onclick="tog('mostrar',${n})">${S.mostrar[n]?'Ocultar':'Mostrar'} diapositiva</button>`}
  if(n==LAST)h+=`<button onclick="ref('estado/pub').set(${!S.pub})">${S.pub?'Retirar':'Publicar'} resultados</button>`;
  h+=`<button class="s" onclick="csv()">Exportar CSV</button>`}
 else if(S.libre)h+=`<button class="s" onclick="goL(-1)">◀</button><b>${n} / ${NS}</b><button class="s" onclick="goL(1)">▶</button>`+(li!=null&&li!=S.i+1?`<button class="s" onclick="li=null;draw()">Seguir al docente</button>`:'');
 else h+=`<b>${n} / ${NS}</b>`;
 $('#ctl').innerHTML=h;rd=null;panel();
}
window.go=d=>ref('estado/i').set(Math.max(0,Math.min(NS-1,(S.i||0)+d)));
window.goL=d=>{li=Math.max(1,Math.min(NS,cur()+d));draw()};
window.tog=(k,n)=>{ref('estado/'+k+'/'+n).set(!S[k][n]);if(k=='act'&&S.act[n])ref('estado/mostrar/'+n).set(false)};
window.ref=ref;

function items(n){const a=ACT[n],c=a.i.length;return a.i.map((it,k)=>({q:it[0],c:it[1],o:it[2]||a.o,pt:a.p/c}))}
function ok(a,it,v){return a.t=='pred'?it.c.split('|').map(nm).includes(nm(v||'')):v===it.c}
function score(n,a){const a0=ACT[n];let s=0;items(n).forEach((it,k)=>{if(ok(a0,it,a[k]))s+=it.pt});return Math.round(s*10)/10}
function totals(){const t={};SC.forEach(n=>Object.entries(R[n]||{}).forEach(([c,r])=>{t[c]=t[c]||{n:r.n,g:r.g,s:0};t[c].s+=r.s||0}));return t}

function panel(soft){
 const n=cur(),a=ACT[n],p=$('#pan');if(!p)return;
 if(n==LAST)return final(p);
 if(!a){p.innerHTML='';rd=null;return}
 if(doc)return teach(p,n,a);
 const open=S.act[n],mine=(R[n]||{})[me.c],key=n+'|'+open+'|'+!!mine+'|'+!!S.rev[n]+(mine?'|'+mine.s:'');
 if(soft&&rd==key)return;rd=key;
 let h=`<div class="box"><h3>${E(a.h)}</h3>`;
 if(!open&&!mine)h+='<p>La actividad aún no está abierta.</p>';
 else if(mine)h+=answered(n,a,mine);
 else h+=form(n,a);
 p.innerHTML=h+'</div>';
}
function form(n,a){
 let h='';
 if(a.t=='sel'||a.t=='pred')items(n).forEach((it,k)=>{
  h+=`<div class="it">${k+1}. ${E(it.q)}<br>`;
  if(a.t=='pred')h+=`<input data-k="${k}" placeholder="Respuesta">`;
  else{const idx=it.o.map((_,j)=>j),ord=a.sh?shuf(idx,me.c+n+k):idx;
   h+=`<select data-k="${k}"><option value="">—</option>${ord.map(j=>`<option value="${j}">${E(it.o[j])}</option>`).join('')}</select>`}
  h+='</div>'});
 if(a.t=='vot')h+=a.o.map((o,j)=>`<div><label><input type="radio" name="v" value="${j}"> ${E(o)}</label></div>`).join('');
 if(a.t=='nube')h+='<input class="w" maxlength="30"> <input class="w" maxlength="30"> <input class="w" maxlength="30">';
 if(a.t=='txt')h+=a.f.map((f,k)=>`<p>${E(f)}<br><textarea data-k="${k}" rows="2"></textarea></p>`).join('');
 return h+`<button onclick="send(${n})">Enviar</button><span class="msg" id="fe"></span>`}
window.send=async n=>{
 const a=ACT[n],box=$('#pan');let r={n:me.n,g:me.g,t:Date.now()};
 if(a.t=='nube'){const w=[...box.querySelectorAll('.w')].map(x=>x.value.trim()).filter(Boolean);if(!w.length)return;
  if(sessionStorage.getItem('nb'+sala))return $('#fe').textContent=' Ya envió sus palabras.';
  w.forEach(x=>ref('nube').push(x));try{sessionStorage.setItem('nb'+sala,1)}catch(e){}return box.innerHTML='<div class="box">¡Gracias! Palabras enviadas.</div>'}
 const ex=await ref('resp/'+n+'/'+me.c).once('value');if(ex.exists())return $('#fe').textContent=' Ya respondió.';
 const els=[...box.querySelectorAll('[data-k]')];
 if(a.t=='sel'||a.t=='pred'){r.a=els.map(e=>a.t=='sel'?(e.value===''?-1:+e.value):e.value.trim());
  if(r.a.some(v=>v===-1||v===''))if(!confirm('Hay ítems sin responder. ¿Enviar igual?'))return;r.s=score(n,r.a)}
 else if(a.t=='vot'){const c=box.querySelector('input:checked');if(!c)return;r.v=+c.value}
 else if(a.t=='txt')r.x=els.map(e=>e.value.trim());
 ref('resp/'+n+'/'+me.c).set(r)};
function answered(n,a,m){
 let h='<p>✅ Respuesta enviada.</p>';
 if((a.t=='sel'||a.t=='pred')&&S.rev[n]){h+=`<p><b>Puntaje: ${m.s} / ${a.p}</b></p>`;
  items(n).forEach((it,k)=>{const g=ok(a,it,m.a[k]);h+=`<div class="it ${g?'ok':'no'}">${g?'✔':'✘'} ${E(it.q)}${g?'':'<br>Correcta: '+E(a.t=='pred'?it.c.split('|')[0]:it.o[it.c])}</div>`})}
 else if(a.t=='sel'||a.t=='pred')h+='<p>El puntaje se mostrará cuando el docente revele la solución.</p>';
 if(a.t=='vot'&&S.rev[n])h+=votes(n,a);
 return h}
function votes(n,a){const rs=Object.values(R[n]||{}),t=rs.length||1;
 return a.o.map((o,j)=>{const c=rs.filter(r=>r.v===j).length;return `<div>${E(o)} — ${c} (${Math.round(c*100/t)}%)<div class="pb"><i style="width:${c*100/t}%"></i></div></div>`}).join('')}
function teach(p,n,a){
 const rs=Object.values(R[n]||{});let h=`<div class="box"><h3>${E(a.h)}</h3><p>Respuestas: <b>${rs.length}</b> · Actividad ${S.act[n]?'abierta':'cerrada'}</p>`;
 if(a.t=='sel'||a.t=='pred')items(n).forEach((it,k)=>{const c=rs.filter(r=>ok(a,it,r.a[k])).length,pc=rs.length?Math.round(c*100/rs.length):0;
  h+=`<div class="it">${k+1}. ${E(it.q)} <b>${pc}%</b> acierto<div class="pb"><i style="width:${pc}%"></i></div></div>`});
 if(a.t=='vot')h+=votes(n,a);
 if(a.t=='nube'){const c={};Object.values(N).forEach(w=>{const k=nm(w);c[k]=(c[k]||0)+1});
  h+='<div class="cl">'+Object.entries(c).map(([w,v])=>`<span style="font-size:${14+v*8}px">${E(w)}</span>`).join('')+'</div>'}
 if(a.t=='txt'){const g={};Object.values(R[n]||{}).forEach(r=>(g[r.g]=g[r.g]||[]).push(r));
  Object.keys(g).sort().forEach(k=>{h+=`<div class="it"><b>Grupo ${E(k)}</b>`+g[k].map(r=>`<div>• <i>${E(r.n)}</i>: ${(r.x||[]).map(E).join(' / ')}</div>`).join('')+'</div>'})}
 p.innerHTML=h+'</div>'}

function final(p){
 const t=totals(),L=Object.entries(t).map(([c,v])=>({c,...v})).sort((x,y)=>y.s-x.s),vis=doc||S.pub;let h='';
 if(!doc){const m=t[me.c];h+='<div class="box"><h3>Tus resultados</h3>';
  if(!m)h+='<p>Aún no hay respuestas con puntaje.</p>';
  else{const gr=L.filter(x=>x.g==me.g),av=gr.reduce((s,x)=>s+x.s,0)/gr.length;
   h+=`<p>Puntaje: <b>${Math.round(m.s*10)/10} / 100</b> · Promedio de tu grupo (${E(me.g)}): <b>${av.toFixed(1)}</b></p>`;
   const rep={};SC.forEach(n=>{const r=(R[n]||{})[me.c];if(!r||!S.rev[n])return;items(n).forEach((it,k)=>{if(!ok(ACT[n],it,r.a[k])){const x=T[n][T[n].length==1?0:k];rep[x[0]]=x[1]}})});
   const ks=Object.keys(rep);h+=ks.length?'<h3>Para repasar</h3>'+ks.map(k=>`<button class="s" onclick="li=${rep[k]};draw()">${E(k)} (diap. ${rep[k]})</button>`).join(''):'<p class="ok">¡Felicitaciones! No hay temas por repasar.</p>'}
  h+='</div>'}
 if(vis&&L.length){let rk=0,pr=null,rows='';
  L.forEach((x,i)=>{if(x.s!==pr){rk=i+1;pr=x.s}if(rk<=5&&i<8)rows+=`<tr><td>${rk}</td><td>${E(x.n)}</td><td>${E(x.g)}</td><td>${Math.round(x.s*10)/10}</td></tr>`});
  h+=`<div class="box"><h3>Top 5${doc&&!S.pub?' (vista previa docente)':''}</h3><table><tr><th>#</th><th>Nombre</th><th>Grupo</th><th>Puntaje</th></tr>${rows}</table></div>`;
  const bins=[0,0,0,0,0];L.forEach(x=>bins[Math.min(4,Math.floor(x.s/20))]++);
  h+=`<div class="box"><h3>Dashboard del salón (${L.length} participantes)</h3><b>Distribución de puntajes</b>`+bins.map((v,i)=>`<div>${i*20}–${i==4?100:i*20+19} <div class="pb"><i style="width:${v*100/L.length}%"></i></div> ${v}</div>`).join('');
  h+='<br><b>Acierto por actividad</b>'+SC.map(n=>{const rs=Object.values(R[n]||{}),pc=rs.length?Math.round(rs.reduce((s,r)=>s+r.s,0)*100/(rs.length*ACT[n].p)):0;return `<div>Diap. ${n} — ${pc}%<div class="pb"><i style="width:${pc}%"></i></div></div>`}).join('');
  const g={};L.forEach(x=>(g[x.g]=g[x.g]||[]).push(x.s));
  h+='<br><b>Promedio por grupo</b>'+Object.entries(g).sort().map(([k,v])=>`<div>${E(k)}: ${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)} (${v.length})</div>`).join('')+'</div>'}
 else if(!doc)h+='<div class="box">El docente publicará el Top 5 y el dashboard al terminar.</div>';
 p.innerHTML=h}
function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['sala','diapositiva','codigo','nombre','grupo','puntaje','respuestas']];
 Object.keys(R).forEach(n=>Object.entries(R[n]).forEach(([c,r])=>rows.push([sala,n,c,r.n,r.g,r.s??'',JSON.stringify(r.a||(r.v!=null?r.v:(r.x||'')))])));
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download='resultados_'+sala+'.csv';l.click()}
login();
</script></body></html>
